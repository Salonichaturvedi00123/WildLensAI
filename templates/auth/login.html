
{% extends 'base.html' %}
{% load static %}

{% block title %}
Login | WildLens AI
{% endblock %}
{% block css %}
<style>
.login-image{
    height:700px;
    width:100%;
    border-radius:35px;

    background-image:url("{% static 'images/login.png' %}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    position:relative;
    overflow:hidden;

    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

/* Dark Overlay */

.login-image::before{
    content:"";
    position:absolute;
    inset:0;

    background:linear-gradient(
        120deg,
        rgba(11,93,59,.45),
        rgba(0,0,0,.15),
        rgba(0,0,0,.35)
    );
}

/* Optional Text on Image */

.login-image::after{
    

    position:absolute;

    left:40px;
    bottom:40px;

    color:#fff;
    font-size:2rem;
    font-weight:700;

    line-height:1.3;

    width:80%;

    z-index:2;

    text-shadow:0 4px 15px rgba(0,0,0,.4);
}
.card{
    border:none;
    border-radius:30px;
    box-shadow:0 25px 60px rgba(0,0,0,.15);
    backdrop-filter:blur(10px);
}

.card-body{
    padding:50px;
}

.form-control{
    height:55px;
    border-radius:15px;
    border:1px solid #ddd;
}

.form-control:focus{
    border-color:#198754;
    box-shadow:0 0 0 .2rem rgba(25,135,84,.15);
}

.btn-success{
    height:55px;
    border-radius:15px;
    font-size:18px;
    font-weight:600;
}

body{
    background:linear-gradient(135deg,#eef7f2,#f9fbfa);
}

.input-group-text{
    background:#fff;
    border-radius:15px 0 0 15px;
    border:1px solid #ddd;
    border-right:none;
}

.form-control{
    height:55px;
    border-radius:0 15px 15px 0;
    border:1px solid #ddd;
}

.form-control:focus{
    border-color:#198754;
    box-shadow:none;
}
.btn-success{
    height:55px;
    border-radius:15px;
    font-size:18px;
    font-weight:600;
    transition:.3s;
}

.btn-success:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(25,135,84,.3);
}
</style>
 {% endblock %}


{% block content %}
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<section class="min-vh-100 d-flex align-items-center">

    <div class="container">

        <div class="row align-items-center">

            <!-- Left Illustration -->
<div class="col-lg-6 d-none d-lg-block">

    <div class="login-image"></div>

</div>

            <!-- Login Card -->

            <div class="col-lg-6">

                <div class="card border-0 shadow-lg rounded-5 mx-auto"
                     style="max-width:480px;">

                    <div class="card-body p-5">

                        <!-- Logo -->

                        <div class="text-center mb-4">

                            <img src="{% static 'images/logo.png' %}"
                                 width="80"
                                 class="mb-3">

                            <h2 class="fw-bold">
                                Welcome Back!
                            </h2>

                            <p class="text-muted">
                                Login to your WildLens AI account
                            </p>

                        </div>

                        <!-- Form -->

                        <form method="POST">

                            {% csrf_token %}

                            <!-- Username -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Username
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-white">
                                        <i class="bi bi-person"></i>
                                    </span>

                                    <input
                                        type="text"
                                        class="form-control"
                                        name="username"
                                        placeholder="Enter username"
                                        required>

                                </div>

                            </div>

                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Password
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-white">
                                        <i class="bi bi-lock"></i>
                                    </span>

                                    <input
                                        type="password"
                                        class="form-control"
                                        name="password"
                                        placeholder="Enter password"
                                        required>

                                </div>

                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="checkbox">

                                    <label class="form-check-label">
                                        Remember me
                                    </label>

                                </div>

                                <a href="#"
                                   class="text-success text-decoration-none">

                                    Forgot Password?

                                </a>

                            </div>

                            <!-- Button -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-success btn-lg rounded-3">

                                    Login

                                </button>

                            </div>

                        </form>

                        <div class="text-center mt-4">

                            <span class="text-muted">
                                Don't have an account?
                            </span>

                            <a href="{% url 'register' %}"
                               class="text-success fw-bold text-decoration-none">

                                Sign Up

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
