{% extends 'base.html' %}
{% load static %}

{% block title %}
Login | WildLens AI
{% endblock %}

{% block css %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{

background:#edf2ec;

font-family:Poppins,sans-serif;

}

.login-page{

min-height:100vh;


display:flex;

align-items:center;

padding:30px;

}

.login-wrapper{

border-radius:35px;

overflow:hidden;

background:#fff;

}

.login-image{

height:750px;

background:url("{% static 'images/login.png' %}");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

}

.login-card{

height:750px;

display:flex;

flex-direction:column;

justify-content:center;

padding:60px;

}

.logo{

width:200px;

margin:auto;

display:block;


}

.login-card h1{

text-align:center;

font-size:48px;

font-weight:700;

margin-bottom:10px;

}

.login-card p{

text-align:center;

color:#666;

margin-bottom:40px;

}

.input-group-text{

background:#fff;

border:1px solid #ddd;

}

.form-control{

height:58px;

border:1px solid #ddd;

border-left:none;

}

.form-control:focus{

box-shadow:none;

border-color:#198754;

}

.eye{

cursor:pointer;

}

.btn-success{

height:58px;

font-size:22px;

font-weight:600;

border-radius:12px;

}

.divider{

display:flex;

align-items:center;

margin:35px 0;

}

.divider::before{

content:"";

flex:1;

height:1px;

background:#ddd;

}

.divider span{

margin:0 15px;

color:#666;

}

.divider::after{

content:"";

flex:1;

height:1px;

background:#ddd;

}

.signup{

text-align:center;

font-size:18px;

}

.signup a{

text-decoration:none;

font-weight:700;

color:#2e7d32;

}

@media(max-width:992px){

.login-image{

display:none;

}

.login-card{

height:auto;

padding:40px;

}

.login-card h1{

font-size:38px;

}

}
</style>

{% endblock %}

{% block content %}

<section class="login-page">

<div class="container-fluid">

<div class="row login-wrapper shadow">

    <!-- Left Image -->

    <div class="col-lg-7 p-0">

        <div class="login-image"></div>

    </div>

    <!-- Right -->

    <div class="col-lg-5 p-0">

        <div class="login-card">

            <!-- logo -->

            <img src="{% static 'images/logo.png' %}" class="logo">

            <h1>Welcome Back!</h1>

            <p>Login to your account</p>

            <form method="POST">

                {% csrf_token %}

                <div class="input-group mb-3">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                    type="text"
                    class="form-control"
                    placeholder="Username"
                    name="username">

                </div>

                <div class="input-group mb-4">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                    type="password"
                    class="form-control"
                    placeholder="Password"
                    id="password"
                    name="password">

                    <span class="input-group-text eye"
                    onclick="togglePassword()">

                        <i class="bi bi-eye" id="eye"></i>

                    </span>

                </div>

                <button class="btn btn-success w-100 btn-lg">

                    Login

                </button>

            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <p class="signup">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Sign Up
                </a>

            </p>

        </div>

    </div>

</div>

</div>

</section>

<script>

function togglePassword(){

let password=document.getElementById("password");

let eye=document.getElementById("eyeIcon");

if(password.type==="password"){

password.type="text";

eye.classList.remove("bi-eye");

eye.classList.add("bi-eye-slash");

}

else{

password.type="password";

eye.classList.remove("bi-eye-slash");

eye.classList.add("bi-eye");

}

}

</script>

{% endblock %}
